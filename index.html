<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Simple debt book for small shops. Record what customers owe and what they pay back.">
  <title>Debt Book</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">Debt Book</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">&#9881;</button>
  </header>

  <main id="app"></main>

  <div id="backupBanner" class="banner" hidden>
    <span id="backupBannerText"></span>
    <button id="backupNowBtn" class="btn small">Back up now</button>
  </div>

  <dialog id="dialog">
    <form id="dialogForm" method="dialog"></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
